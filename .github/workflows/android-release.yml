name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Ручной запуск (Actions → Android release → Run workflow) — тестовая
      # сборка для себя: подписана тем же ключом, ставится поверх релиза,
      # но без тега и без GitHub Release. Проверка обновлений в приложении
      # смотрит релизы и теги, поэтому тестовую сборку никто не увидит.
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          version="${GITHUB_REF_NAME#v}"
          gradle_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$gradle_version"
          test "$version" = "$gradle_version"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            go_client/go.sum

      - name: Install Android SDK packages
        shell: bash
        # SDK уже стоит на раннере ubuntu-24.04 ($ANDROID_HOME); сторонний
        # android-actions/setup-android@v3 падал после перевода actions на
        # Node 24 — ставим нужные пакеты штатным sdkmanager.
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keystore="$RUNNER_TEMP/qwdtt-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s\n' \
            "KEYSTORE_FILE=$keystore" \
            "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" \
            "KEY_ALIAS=$KEY_ALIAS" \
            "KEY_PASSWORD=$KEY_PASSWORD" > local.properties

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a,x86_64 --no-daemon

      - name: Verify and name APKs
        shell: bash
        run: |
          mkdir -p dist
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            gradle_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            version="${gradle_version}-test-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk" || continue
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            base="$(basename "$apk")"
            arch="${base#app-}"
            arch="${arch%-release.apk}"
            cp "$apk" "dist/qwdtt-${version}-${arch}.apk"
            found=1
          done
          test "$found" = 1
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload test APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: qwdtt-${{ env.APP_VERSION }}-test-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "qWDTT ${GITHUB_REF_NAME}" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
